            fill="none" stroke="#ffffff" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="452" cy="128" r="24" fill="#ffffff"/>
  <!-- 信号3灯 (ダッシュボードの🟢🟡🔴) -->
  <circle cx="180" cy="452" r="22" fill="#0ca30c"/>
  <circle cx="256" cy="452" r="22" fill="#fab219"/>
  <circle cx="332" cy="452" r="22" fill="#d03b3b"/>
</svg>
