name: AI Bubble Dashboard

on:
  schedule:
    # GitHubのcronはベストエフォートで、:00/:30などの混雑時刻は数時間遅延しうる。
    # 半端な分を使い、朝+昼の2本体制で1本落ちても当日データが入るようにする。
    # (2回実行されても履歴マージ・イベント検出は冪等なので無害)
    - cron: "17 23 * * *"  # JST 8:17頃
    - cron: "47 4 * * *"   # JST 13:47頃 (バックアップ)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/ai_dashboard/manual_inputs.yaml"
      - ".github/workflows/ai_dashboard.yml"

permissions:
  contents: write

concurrency:
  group: ai-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_DASHBOARD_DISCORD_WEBHOOK_URL: ${{ secrets.AI_DASHBOARD_DISCORD_WEBHOOK_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -m src.ai_dashboard

      - name: Commit data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_dashboard/history.json docs/ai-dashboard/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update AI dashboard [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git pull --rebase origin main
          git push

# GitHub Pagesは「Deploy from a branch (main / /docs)」方式を使う。
# リポジトリ Settings → Pages で1回設定すれば、上のcommit後に
# GitHubが自動でデプロイする (このワークフローに追加ジョブは不要)。
